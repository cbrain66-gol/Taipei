name: Sync Timeline from Google Drive

on:
  schedule:
    # 每天台北時間 17:30（UTC 09:30）自動執行
    - cron: '30 9 * * *'
  workflow_dispatch: # 支援手動點擊按鈕立即執行

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest HTML from Google Drive
        run: |
          FILE_ID="1lViUV_etAwh1fKHxOif5zRk2E2dYQMCX"
          curl -L "https://drive.google.com/uc?export=download&id=${FILE_ID}" -o index.html

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update: $(date +'%Y-%m-%d') Taipei Mayor timeline"
            git push
          fi
