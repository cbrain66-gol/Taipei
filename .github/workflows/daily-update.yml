name: Daily Taipei Mayor Timeline Auto-Update

on:
  schedule:
    # 每天台北時間下午 17:00（UTC 09:00）自動執行
    - cron: '0 9 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊按鈕立即執行

jobs:
  update-timeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Update Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_timeline.py

      - name: Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No new updates to commit."
          else
            git commit -m "Auto-update: $(date +'%Y-%m-%d') Taipei Mayor timeline"
            git push
          fi
